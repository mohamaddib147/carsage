<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon.svg is a copy of frontend/src/assets/favicon-icon.svg — a
         cleaner icon export (car+brain in a ring, no wordmark), with a
         prefers-color-scheme style baked in so it auto-switches to white on
         a dark browser tab. Keep in sync. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarSage: The Mindful Driver's Co-Pilot</title>
    <meta
      name="description"
      content="Everything about your car, in one place. Plan trips with real-world fuel cost estimates, and get clear DIY-or-mechanic guidance for any car issue."
    />

    <!-- Open Graph / social link previews (LinkedIn, Slack, Jira, ...).
         og:url and og:image use the production Netlify address directly
         (not a relative path) since social crawlers fetch these outside
         the page's own origin context and need an absolute URL. Update
         both if the production URL ever changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CarSage" />
    <meta property="og:title" content="CarSage: The Mindful Driver's Co-Pilot" />
    <meta
      property="og:description"
      content="Everything about your car, in one place. Plan trips with real-world fuel cost estimates, and get clear DIY-or-mechanic guidance for any car issue."
    />
    <meta property="og:url" content="https://carsage.netlify.app/" />
    <meta property="og:image" content="https://carsage.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CarSage: The Mindful Driver's Co-Pilot" />
    <meta
      name="twitter:description"
      content="Everything about your car, in one place. Plan trips with real-world fuel cost estimates, and get clear DIY-or-mechanic guidance for any car issue."
    />
    <meta name="twitter:image" content="https://carsage.netlify.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
